# Pearlist — configuration de déploiement Netlify.
#
# Le build rapatrie les données et les images depuis le miroir public de
# Pearl App (voir build.mjs), afin qu'aucune requête ne parte vers Firebase ou
# Cloudinary quand un visiteur consulte le site.

[build]
  command = "node build.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Les fichiers générés au build changent à chaque publication : ils ne doivent
# jamais être servis depuis un cache périmé.
[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# À l'inverse, images, polices et bibliothèques portent un nom stable dérivé de
# leur contenu ou de leur version : on peut les mettre en cache longtemps.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

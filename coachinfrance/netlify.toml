# Déploiement Coach in France — hébergement statique gratuit sur Netlify.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Les pages HTML sont regénérées à chaque publication depuis le back-office :
# elles ne doivent jamais être servies depuis un cache périmé.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Astro donne aux fichiers compilés un nom dérivé de leur contenu : on peut les
# mettre en cache très longtemps sans risque de servir une version obsolète.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Le back-office n'a rien à faire dans les résultats de recherche.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Anciennes adresses du site en .php : on les redirige pour ne perdre ni les
# visiteurs ni le référencement acquis.
# À COMPLÉTER avec la liste réelle des anciennes URLs.
[[redirects]]
  from = "/organisme-de-formation-bretagne/mentions-legales.php"
  to = "/mentions-legales"
  status = 301

[[redirects]]
  from = "/organisme-de-formation-bretagne/validation-acquis-experience.php"
  to = "/formations"
  status = 301

[[redirects]]
  from = "/organisme-de-formation-bretagne/formation-hybride.php"
  to = "/formations"
  status = 301

[[redirects]]
  from = "/organisme-de-formation-bretagne/centre.php"
  to = "/le-centre"
  status = 301

[[redirects]]
  from = "/organisme-de-formation-bretagne/centre-formation-apprenti.php"
  to = "/le-centre"
  status = 301

[[redirects]]
  from = "/organisme-de-formation-bretagne/*"
  to = "/formations"
  status = 301
